<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" routerLink="/">{{ profile.name }}</a>
    <nav aria-label="Secciones">
      <ul>
        <li><a routerLink="/" fragment="proyectos">Proyectos</a></li>
        <li><a routerLink="/" fragment="experiencia">Experiencia</a></li>
        <li><a routerLink="/" fragment="contacto">Contacto</a></li>
      </ul>
    </nav>
    <a class="cv-link" [href]="profile.cv" download>CV en PDF</a>
  </div>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <p>{{ profile.name }}, {{ year }}.</p>
    <p>
      Hecho con Angular y desplegado en Vercel.
      <a href="https://github.com/danimmll/portfolio">Código de esta web</a>
    </p>
  </div>
</footer>
